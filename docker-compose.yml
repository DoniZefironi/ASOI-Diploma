version: '3.8'

services:
  db:
    image: postgres:15
    container_name: asoi_diploma_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asoi_diploma}
      POSTGRES_USER: ${POSTGRES_USER:-asoi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asoi_pass}
      # Добавляем LANG и LC_ALL для PostgreSQL контейнера
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    # УБРАНО: проброс порта 5432 наружу для безопасности
    # ports:
    #   - "5432:5432" 
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asoi_user} -d ${POSTGRES_DB:-asoi_diploma}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.nestjs
    container_name: asoi_diploma_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-4450}@db:5432/${POSTGRES_DB:-Curs}
      PORT: 2904
      # Добавляем LANG и LC_ALL для backend контейнера
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    ports:
      - "2904:2904"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2904/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s 

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asoi_diploma_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:2904
      # Добавляем LANG и LC_ALL для frontend контейнера (если Next.js или Nginx внутри чувствительны к локали)
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data: # Именованный том для данных БД

networks:
  app-network: # Пользовательская сеть
    driver: bridge